<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#120b08">
<meta name="color-scheme" content="dark">
<title>La oficina del tenis</title>
<style>
/* Madera oscura, ladrillo y verde de pista: los colores de la oficina */
:root {
  color-scheme: dark;
  --fondo: #120b08; --texto: #f4e7d3; --suave: #c2a88a; --borde: rgba(255, 214, 170, .14);
  --tarjeta: rgba(255, 236, 210, .05); --tarjeta2: rgba(255, 236, 210, .08);
  --madera: #6b4226; --madera-clara: #8a5a36; --madera-oscura: #2a170d;
  --acento: #a6d65a; --acento-suave: rgba(166, 214, 90, .16); --ambar: #e9b44c;
  --sube: #8fe07a; --baja: #ff8a75; --aviso: #f2c25a;
  --sube-fondo: rgba(143, 224, 122, .14); --baja-fondo: rgba(255, 138, 117, .15); --neutro-fondo: rgba(255, 236, 210, .08); --aviso-fondo: rgba(242, 194, 90, .14);
  --papel: #f3e6cc; --tinta: #2a1d12;
  --pixel: "Pixelify Sans", "Courier New", monospace;
  --vidrio: linear-gradient(165deg, rgba(58, 34, 20, .93), rgba(30, 18, 11, .93));
  --sombra: 0 14px 40px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 220, 180, .1);
}
* { box-sizing: border-box; font-feature-settings: "calt" 0, "liga" 0, "clig" 0; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; overflow: hidden; color: var(--texto);
  background: radial-gradient(900px 600px at 50% 40%, #2a1710, transparent 70%), var(--fondo);
  font: 14.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--acento); }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.sube { color: var(--sube) !important; } .baja { color: var(--baja) !important; }
.vacio { color: var(--suave); font-style: italic; margin: 0; }

/* Marcos de madera: cabecera, menú, paneles y ficha */
.madera { background: var(--vidrio); border: 2px solid var(--madera); box-shadow: var(--sombra), inset 0 0 0 1px rgba(0, 0, 0, .35);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

/* --- La oficina a pantalla completa --- */
.escena { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.caja-lienzo { position: absolute; transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
@media (min-width: 1000px) { body.con-panel .caja-lienzo { transform: translateX(230px); } body.con-panel.panel-grande .caja-lienzo { transform: none; } }
.caja-lienzo canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
body.ampliada .escena { cursor: grab; } .escena.moviendo, .escena.moviendo canvas { cursor: grabbing; }
.capa { position: absolute; inset: 0; pointer-events: none; container-type: inline-size; }
.etiqueta { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; border: 0; cursor: pointer; white-space: nowrap;
  font: 700 11.5px/1 var(--pixel); color: #fff; background: rgba(26, 14, 8, .78); padding: 3px 6px 3px 4px; border-radius: 5px;
  box-shadow: 0 0 0 1px rgba(255, 220, 180, .25); display: inline-flex; gap: 4px; align-items: center; }
.etiqueta .emo { font-size: 11px; }
.etiqueta[aria-pressed="true"] { background: var(--acento); color: #17240b; }
.etiqueta.sala { background: rgba(32, 48, 82, .9); box-shadow: 0 0 0 1px rgba(150, 190, 255, .45); padding: 4px 8px 4px 5px; }
.bocadillo { position: absolute; transform: translate(-50%, calc(-100% - 20px)); width: max-content; max-width: min(250px, 42%);
  background: #fffaf0; color: #1d140c; border: 2px solid #1d140c; border-radius: 6px; padding: 4px 8px;
  font: 600 12px/1.3 var(--pixel); opacity: 0; transition: opacity .25s; pointer-events: none; box-shadow: 3px 3px 0 rgba(0, 0, 0, .35); }
.bocadillo::after { content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #1d140c; border-bottom: 0; }
.bocadillo.visible { opacity: 1; }
.bocadillo .ver { cursor: pointer; display: inline-block; padding: 0 3px; margin: -2px 0 -2px -3px; border-radius: 4px; background: rgba(166, 214, 90, .35); }
.bocadillo small { color: #6b4a2c; font-weight: 700; }
.cartel { position: absolute; transform: translate(-50%, -100%); background: #ffd55a; color: #3d2c00; font: 700 11px var(--pixel); padding: 2px 7px; border: 2px solid #3d2c00; border-radius: 3px; }
/* Letrero de luces en la pared del fondo (va inclinado como la pared) */
.letrero { position: absolute; transform: translate(-50%, -50%) skewY(26.565deg); pointer-events: auto; cursor: pointer; border: 0; background: none; padding: 0;
  font: 700 1.25cqw/1.15 var(--pixel); color: #b8ff6a; text-shadow: 0 0 .5cqw rgba(160, 255, 90, .8); letter-spacing: .06em; white-space: nowrap; text-align: center; }
.letrero small { display: block; font-size: .78cqw; color: #ffd36b; text-shadow: 0 0 .4cqw rgba(255, 200, 90, .7); }
.zoom { position: fixed; z-index: 21; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 4px; padding: 5px; border-radius: 12px; }
.zoom button { width: 36px; height: 36px; border: 0; border-radius: 8px; background: rgba(255, 236, 210, .08); font-size: 20px; line-height: 1; cursor: pointer; }
.zoom button:hover { background: rgba(255, 236, 210, .16); }

/* --- Cabecera, menú y pie --- */
.cab { position: fixed; z-index: 22; top: 14px; right: 14px; display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 12px; }
.logo { width: 34px; height: 34px; border-radius: 8px; background: #2f6b34; display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 2px #a6d65a; }
.cab .como { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--acento); background: none; color: var(--acento); font: 700 16px var(--pixel); cursor: pointer; }
.cab .como:hover { background: var(--acento); color: #17240b; }
.cab h1 { font: 700 16px/1.1 var(--pixel); margin: 0; }
.cab .sub { color: var(--suave); font-size: 11.5px; }
.dock { position: fixed; z-index: 26; top: 14px; left: 14px; display: flex; gap: 3px; padding: 5px; border-radius: 12px; }
.dock button { display: flex; align-items: center; gap: 7px; border: 0; background: none; color: var(--suave); font: 600 14px var(--pixel); padding: 7px 11px; border-radius: 8px; cursor: pointer; }
.dock button .ico { font-size: 16px; line-height: 1; }
.dock button .ct { display: none; }
.dock button:hover { color: var(--texto); background: rgba(255, 236, 210, .07); }
.dock button[aria-pressed="true"] { color: #17240b; background: var(--acento); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .25); }
.pie-escena { position: fixed; z-index: 20; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 14px; white-space: nowrap;
  padding: 6px 14px; border-radius: 999px; font-size: 12.5px; color: var(--suave); }
.pie-escena #que-hacen { color: var(--texto); font-weight: 600; }
body.con-panel .pie-escena { left: calc(50% + 230px); }
body.panel-grande .pie-escena { opacity: 0; }
@media (max-width: 1150px) { .pie-escena .pista { display: none; } }
@media (min-width: 700px) and (max-width: 1250px) { .cab .tit { display: none; } .cab { padding-right: 6px; } }

/* --- Paneles --- */
.panel { position: fixed; z-index: 24; top: 72px; left: 14px; bottom: 14px; width: 450px; border-radius: 14px; overflow-y: auto; overscroll-behavior: contain; padding: 0 14px 18px;
  transform: translateX(calc(-100% - 30px)); visibility: hidden; transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility .3s, width .3s; }
.panel.abierto { transform: none; visibility: visible; }
.panel.grande { width: min(900px, calc(100vw - 28px)); }
.cab-panel { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 12px 0 10px; margin: 0 -2px;
  background: linear-gradient(#3a2214 70%, rgba(58, 34, 20, 0)); }
.cab-panel b { font: 700 19px var(--pixel); flex: 1; }
/* ← vuelve un paso atrás; ✕ cierra y deja la oficina a la vista */
.atras { display: none; border: 0; width: 32px; height: 32px; border-radius: 8px; background: rgba(255, 236, 210, .1); font-size: 18px; line-height: 1; cursor: pointer; flex: none; }
body.puede-atras .atras { display: block; }
body:has(.ficha.abierta) .cab-panel .atras { display: none; }
.cab-panel .atras { margin-right: 8px; }
.ficha .atras { margin-left: auto; align-self: flex-start; width: 36px; height: 36px; }
body.puede-atras .ficha .atras + .cerrar { margin-left: 6px; }
.plegar { border: 0; width: 32px; height: 32px; border-radius: 8px; background: rgba(255, 236, 210, .1); font-size: 18px; line-height: 1; cursor: pointer; }
section[hidden] { display: none; }
h3 { font: 700 15px var(--pixel); margin: 0 0 6px; letter-spacing: .01em; }
h4 { font: 700 15px var(--pixel); margin: 18px 2px 8px; color: var(--ambar); }
.tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 12px 14px; }
.tarjeta + .tarjeta { margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; padding: 1px 9px; border-radius: 999px; background: var(--neutro-fondo); color: var(--suave); white-space: nowrap; }
.chip.bien { background: var(--sube-fondo); color: var(--sube); } .chip.mal { background: var(--baja-fondo); color: var(--baja); } .chip.ojo { background: var(--aviso-fondo); color: var(--aviso); }
.rejilla { display: grid; gap: 10px; }
.rejilla > .tarjeta + .tarjeta { margin-top: 0; }
@media (min-width: 760px) { .panel.grande .rejilla.dos { grid-template-columns: 1fr 1fr; } }
.hoy ul { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 5px; }
.bitacora { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.bitacora li { padding: 5px 0; border-top: 1px dashed var(--borde); } .bitacora li:first-child { border-top: 0; }
.bitacora time { color: var(--suave); font-size: 11.5px; margin-right: 6px; }
.pix { width: 46px; height: 46px; image-rendering: pixelated; background: rgba(255, 236, 210, .07); border-radius: 8px; flex: none; border: 2px solid var(--madera); }
.pix.grande { width: 84px; height: 84px; }
.pix.mini { width: 26px; height: 26px; border-width: 1px; border-radius: 5px; }
.analista { display: flex; gap: 12px; align-items: center; cursor: pointer; text-align: left; width: 100%; border: 0; background: none; padding: 0; }
.analista .info { flex: 1; min-width: 0; }
.analista .info b { font: 700 16px var(--pixel); display: block; }
.analista .info small { color: var(--suave); font-size: 12.5px; }
.cifras { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--suave); }
.cifras > div { white-space: nowrap; }
.cifras b { display: block; font-size: 14.5px; color: var(--texto); }
.barra { height: 8px; background: rgba(0, 0, 0, .35); border-radius: 2px; overflow: hidden; margin-top: 8px; box-shadow: inset 0 0 0 1px rgba(255, 220, 180, .12); }
.barra i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--acento) 0 8px, #7fae3e 8px 10px); }

/* Cartelera */
.torneo { margin-top: 14px; }
.torneo > h3 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.partido { margin-top: 8px; }
.partido .cabecera { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.partido .jugadores { font-weight: 700; }
.partido .hora { color: var(--suave); font-size: 12.5px; }
.mercados { display: grid; gap: 8px; margin-top: 10px; }
@media (min-width: 760px) { .panel.grande .mercados { grid-template-columns: repeat(3, 1fr); } }
.mercado { background: rgba(0, 0, 0, .22); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.mercado b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--suave); margin-bottom: 3px; }
.opcion { display: flex; justify-content: space-between; gap: 6px; padding: 2px 0; }
.opcion .q { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ambar); }
.opcion .p { color: var(--suave); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.apostado { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.superficie { font-size: 11.5px; padding: 1px 8px; border-radius: 3px; font-weight: 700; color: #fff; }
.superficie.hard { background: #3466b0; } .superficie.clay { background: #c0602e; } .superficie.grass { background: #3d8a3a; }

/* Boletos: papel claro con bordes troquelados */
.buscar { width: 100%; margin: 2px 0 8px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto); font: inherit; font-size: 14px; }
.filtros { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 10px; }
.filtros button { border: 1px solid var(--borde); background: var(--tarjeta); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.filtros button[aria-pressed="true"] { background: var(--acento); color: #17240b; border-color: var(--acento); font-weight: 700; }
.boletos { display: grid; gap: 14px; }
@media (min-width: 760px) { .panel.grande .boletos { grid-template-columns: repeat(2, 1fr); } }
.boleto { position: relative; background: var(--papel); color: var(--tinta); border-radius: 3px; padding: 14px 16px 12px; font-size: 13.5px; box-shadow: 0 4px 0 rgba(0, 0, 0, .3); }
.boleto::before, .boleto::after { content: ""; position: absolute; left: 0; right: 0; height: 6px; background: radial-gradient(circle at 5px 0, #2a1810 4px, transparent 4.5px) repeat-x; background-size: 10px 6px; }
.boleto::before { top: 0; } .boleto::after { bottom: 0; transform: scaleY(-1); }
.boleto .quien { display: flex; align-items: center; gap: 8px; font: 700 14px var(--pixel); }
.boleto .quien small { font: 12px system-ui, sans-serif; color: #7a6650; }
.boleto .sel { font-weight: 750; font-size: 15px; margin: 8px 0 2px; padding-right: 70px; }
.boleto .det { color: #6d5a45; font-size: 12.5px; }
.boleto .linea { display: flex; justify-content: space-between; gap: 6px; border-top: 1px dashed #c9b48f; padding-top: 6px; margin-top: 6px; flex-wrap: wrap; }
.boleto .chip { background: rgba(0, 0, 0, .07); color: #6d5a45; } .boleto .chip.bien { color: #2d7a2a; background: rgba(45, 122, 42, .12); } .boleto .chip.mal { color: #b03a26; background: rgba(176, 58, 38, .12); }
.boleto .sube { color: #2d7a2a !important; } .boleto .baja { color: #b03a26 !important; }
.boleto details { margin-top: 6px; color: #6d5a45; font-size: 12.5px; }
.sello { position: absolute; top: 12px; right: 12px; font: 700 13px var(--pixel); padding: 1px 8px; border: 2px solid currentColor; border-radius: 3px; transform: rotate(5deg); }
.sello.ganada { color: #2d7a2a; } .sello.perdida { color: #b03a26; } .sello.pendiente { color: #a26a00; } .sello.nula { color: #7a6650; }

/* Clasificación */
table.tabla { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tabla th { text-align: left; font-size: 11.5px; color: var(--suave); font-weight: 600; padding: 6px; border-bottom: 1px solid var(--borde); }
.tabla td { padding: 7px 6px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
.tabla td.n, .tabla th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tabla tr:last-child td { border-bottom: 0; }
.emocion { margin-top: 8px; } .emocion .fila { display: flex; justify-content: space-between; font-size: 13.5px; }
.emocion .barra { margin-top: 3px; } .emocion small { color: var(--suave); font-size: 12px; }
.tabla .nom { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-weight: 650; }
.desplaza { overflow-x: auto; }
.medalla { font-size: 16px; }

/* Sala e informes */
.informe p { margin: 6px 0; }
details.plegable > summary { cursor: pointer; font-weight: 650; list-style: none; }
details.plegable > summary::-webkit-details-marker { display: none; }
details.plegable > summary::before { content: "▸ "; color: var(--suave); }
details.plegable[open] > summary::before { content: "▾ "; }

/* --- Ficha de un analista --- */
.ficha { position: fixed; z-index: 30; top: 14px; right: 14px; bottom: 14px; width: min(470px, calc(100vw - 28px)); border-radius: 14px; overflow-y: auto; overscroll-behavior: contain;
  padding: 16px 16px 30px; transform: translateX(calc(100% + 30px)); visibility: hidden; transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility .3s; }
.ficha.abierta { transform: none; visibility: visible; }
.ficha .cabecera { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.ficha .cabecera h2 { font: 700 22px var(--pixel); margin: 0; }
.ficha .cerrar { margin-left: auto; align-self: flex-start; border: 0; background: rgba(255, 236, 210, .1); border-radius: 8px; width: 36px; height: 36px; cursor: pointer; font-size: 17px; }
.grafica svg { width: 100%; height: 150px; display: block; }
.grafica.todos svg { height: 190px; }
.leyenda { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--suave); margin-top: 6px; }
.leyenda i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.ver-partido { border: 0; background: none; color: inherit; font: inherit; padding: 0; cursor: pointer; text-align: left; text-decoration: underline dotted rgba(255, 236, 210, .4); text-underline-offset: 3px; }
.ver-partido:hover { color: var(--acento); }
.calib { display: grid; grid-template-columns: 74px 1fr 76px; gap: 4px 8px; align-items: center; font-size: 12.5px; margin-top: 6px; }
.calib .barras { position: relative; height: 14px; background: rgba(255, 236, 210, .06); border-radius: 4px; }
.calib .barras i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.calib .barras i.dijo { background: rgba(255, 236, 210, .22); }
.calib .barras i.salio { top: 4px; bottom: 4px; }
.reglas li { margin: 4px 0; }
.duelo { display: grid; grid-template-columns: 104px 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; margin-top: 5px; }
.duelo .num { white-space: nowrap; }
.barra-duelo { height: 10px; border-radius: 5px; background: rgba(255, 236, 210, .14); overflow: hidden; }
.barra-duelo i { display: block; height: 100%; background: var(--acento); }
.rejilla.dos-fijas { grid-template-columns: 1fr 1fr; margin-top: 10px; }
.jugador { font-size: 13px; } .jugador p { margin: 5px 0; } .jugador small { color: var(--suave); }
.noticias { margin: 2px 0 0; padding-left: 16px; } .noticias li { margin: 3px 0; } .noticias a { color: var(--texto); }
@media (max-width: 480px) { .rejilla.dos-fijas { grid-template-columns: 1fr; } }
.reglas small, .retiradas { color: var(--suave); }
.ayuda { display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 3px; padding: 0; border: 1px solid currentColor; border-radius: 50%;
  background: none; color: var(--suave); font: 700 10px/1 system-ui, sans-serif; cursor: help; vertical-align: 1px; opacity: .75; }
.ayuda:hover, .ayuda[aria-expanded="true"] { opacity: 1; color: var(--acento); }
.boleto .ayuda { color: #7a6650; }
.globo { position: fixed; z-index: 60; max-width: min(300px, calc(100vw - 24px)); background: #1d140c; color: #f4e6d0; border: 1px solid #6b4a2c; border-radius: 8px;
  padding: 9px 11px; font-size: 13px; line-height: 1.4; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
.globo b { display: block; font: 700 13px var(--pixel); color: var(--acento); margin-bottom: 2px; }
.estirar { display: none; }
.carta { font-family: Georgia, "Times New Roman", serif; font-style: italic; background: var(--papel); color: var(--tinta); border-radius: 3px; padding: 10px 12px; margin: 6px 0 0; }

@media (max-width: 699px) {
  .dock button .lg { display: none; } .dock button .ct { display: inline; }
  .tabla.desglose { font-size: 12px; } .tabla.desglose td, .tabla.desglose th { padding: 6px 3px; }
  .cab { top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px; } .cab .sub { display: none; }
  .dock { top: auto; bottom: calc(8px + env(safe-area-inset-bottom)); left: 8px; right: 8px; justify-content: space-around; }
  .dock button { flex: 1 1 0; min-width: 0; flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 2px; }
  .zoom { right: 10px; top: calc(66px + env(safe-area-inset-top)); bottom: auto; }
  .zoom button { width: 38px; height: 38px; }
  .pie-escena { bottom: calc(76px + env(safe-area-inset-bottom)); font-size: 11.5px; } .pie-escena .pista, .pie-escena .aviso-legal { display: none; }
  .panel, .panel.grande, .ficha { top: 0; left: 0; right: 0; bottom: 0; width: auto; border-radius: 0; border: 0; transform: translateY(105%); padding-top: env(safe-area-inset-top); }
  .panel { bottom: calc(68px + env(safe-area-inset-bottom)); }
  .panel.abierto, .ficha.abierta { transform: none; }

function poblar() {

    const an = animo(a); et.innerHTML = `<span class="emo" title="${esc(an.texto)}">${extra.saliendo ? '📦' : an.cara}</span>${esc(a.nombre)}`;

/* ---------- Ficha de un analista ---------- */
let FICHA_ID = null;
function grafica(a) {
  const s = a.serie; if (s.length < 2) return '<p class="vacio">La gráfica aparece cuando haya apuestas liquidadas.</p>';
  const vals = s.map(p => p[1]), base = Object.values(a.botes).reduce((x, b) => x + b.inicial, 0);
  const min = Math.min(base, ...vals), max = Math.max(base, ...vals), H = 150, Wd = 500, y = v => H - 10 - (v - min) / ((max - min) || 1) * (H - 20);
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * Wd).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${Wd} ${H}" preserveAspectRatio="none"><line x1="0" x2="${Wd}" y1="${y(base)}" y2="${y(base)}" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="4 4"/>
    <polyline points="${pts}" fill="none" stroke="${vals[vals.length - 1] >= base ? 'var(--sube)' : 'var(--baja)'}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>
    <small style="color:var(--suave)">Valor de sus botes apuesta a apuesta (la línea discontinua es lo que tenía al empezar)</small>`;
}
function graficaTodos(ags) {
  const series = ags.filter(a => a.serie.length).map(a => ({ a, base: Object.values(a.botes).reduce((x, b) => x + b.inicial, 0), pts: a.serie.map(([f, v]) => [Date.parse(f), v]) }));
  if (!series.length) return '<p class="vacio">La gráfica aparece cuando haya apuestas liquidadas.</p>';
  // Se dibuja la rentabilidad (lo que vale el bote frente a lo que tenía) para comparar botes de distinto tamaño
  for (const s of series) { s.pts = s.pts.map(([t, v]) => [t, v / s.base - 1]); s.pts.unshift([s.pts[0][0] - 864e5, 0]); }
  const ts = series.flatMap(s => s.pts.map(p => p[0])), vs = series.flatMap(s => s.pts.map(p => p[1])).concat(0);
  const t0 = Math.min(...ts), t1 = Math.max(...ts), lo = Math.min(...vs), hi = Math.max(...vs), H = 190, Wd = 500;
  const x = t => (t1 > t0 ? (t - t0) / (t1 - t0) : .5) * Wd, y = v => H - 12 - (v - lo) / ((hi - lo) || 1) * (H - 24);
  const color = a => a.color;
  return `<svg viewBox="0 0 ${Wd} ${H}" preserveAspectRatio="none"><line x1="0" x2="${Wd}" y1="${y(0)}" y2="${y(0)}" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="4 4"/>
    ${series.map(s => `<polyline points="${s.pts.map(([t, v]) => `${x(t).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${color(s.a)}" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`).join('')}</svg>
    <div class="leyenda">${series.map(s => `<span><i style="background:${color(s.a)}"></i>${esc(s.a.nombre)} ${pct(s.pts[s.pts.length - 1][1], true)}</span>`).join('')}</div>
    <small style="color:var(--suave)">Rentabilidad de sus botes desde que empezaron (la línea discontinua es el punto de partida)</small>`;
}

}

/* ---------- Aprendizaje ---------- */
const GRUPOS_DESGLOSE = { mercado: 'Por mercado', superficie: 'Por superficie', cuota: 'Por cuota' };
function tablaDesglose(d) {
  const filas = Object.entries(GRUPOS_DESGLOSE).flatMap(([g, n]) => Object.entries(d?.[g] || {}).sort((x, y) => y[1].apuestas - x[1].apuestas).map(([k, r], i) =>
    `<tr><td>${i ? '' : `<small style="color:var(--suave)">${n}</small><br>`}${esc(k[0].toUpperCase() + k.slice(1))}</td><td class="n">${r.apuestas}</td><td class="n ${clase(r.ganancia)}">${(r.ganancia > 0 ? '+' : '') + Math.round(r.ganancia)} €</td><td class="n ${clase(r.yield)}">${pct(r.yield, true, 0)}</td><td class="n">${pct(r.pct_cierre, false, 0)}</td></tr>`));
  return filas.length ? `<table class="tabla desglose"><tr><th></th><th class="n">Apuestas</th><th class="n">Ganancia</th><th class="n">Rendim.${A('rendimiento')}</th><th class="n">Bate cierre${A('cierre')}</th></tr>${filas.join('')}</table>`
    : '<p class="vacio">Aún no hay apuestas liquidadas.</p>';
}
function calibracion(c) {
  if (!c?.length) return '<p class="vacio">Aún no hay apuestas liquidadas con la probabilidad que dio.</p>';
  return `<div class="calib">${c.map(f => `<span>${pct(f.desde, false, 0)}–${pct(f.hasta, false, 0)}</span>
    <span class="barras" title="Dijo ${pct(f.dijo, false, 0)} de media; salieron el ${pct(f.salio, false, 0)}"><i class="dijo" style="width:${f.dijo * 100}%"></i><i class="salio" style="width:${f.salio * 100}%;background:${f.salio >= f.dijo ? 'var(--sube)' : 'var(--baja)'}"></i></span>
    <span>salió ${pct(f.salio, false, 0)} <small>(${f.apuestas})</small></span>`).join('')}</div>
    <small style="color:var(--suave)">Barra clara: la probabilidad que dio de media. Barra de color: las que salieron. Si la de color queda corta, se pasa de optimista.</small>`;
}
function tarjetaComparar(e) {
  const fila = (n, r) => `<tr><td>${n}</td><td class="n">${r.apuestas}</td><td class="n">${r.apuestas ? pct(r.aciertos, false, 0) : '–'}</td><td class="n ${clase(r.yield)}">${r.apuestas ? pct(r.yield, true) : '–'}</td><td class="n">${pct(r.pct_cierre, false, 0)}</td></tr>`;
  return `<div class="tarjeta desplaza" style="margin-bottom:10px"><h3>💭 ¿Les ayudan las emociones?${A('animo')}</h3>
    <p style="margin:0 0 6px;font-size:13.5px">Desde el ${esc(cuando(e.desde))} cada analista lee su ánimo antes de apostar${e.en_decision ? '' : ' (ahora mismo está apagado: se sigue apuntando, pero no lo leen)'}. Así ha ido toda la oficina antes y después:</p>
    <table class="tabla desglose"><tr><th></th><th class="n">Apuestas</th><th class="n">Aciertos</th><th class="n">Rendim.${A('rendimiento')}</th><th class="n">Bate cierre${A('cierre')}</th></tr>${fila('Antes', e.antes)}${fila('Con emociones', e.despues)}</table>
    <h4 style="margin:10px 0 2px">Toda la oficina, según el ánimo al apostar</h4>${tablaEmociones(e.por_emocion)}</div>`;
}
function tarjetaNoticias(n) {
  const fila = (t, r) => `<tr><td>${t}</td><td class="n">${r.apuestas}${r.pendientes ? ` <small>(+${r.pendientes})</small>` : ''}</td><td class="n ${clase(r.ganancia)}">${r.apuestas ? eur(r.ganancia, true) : '–'}</td><td class="n ${clase(r.yield)}">${r.apuestas ? pct(r.yield, true) : '–'}</td></tr>`;
  const m = n.mes || {};
  return `<div class="tarjeta desplaza" style="margin-bottom:10px"><h3>📰 ¿Valen la pena los créditos de noticias?</h3>
    <p style="margin:0 0 6px;font-size:13.5px">Cuando la sala ve una noticia importante se piden cuotas nuevas (cuesta créditos). ${m.gastados ? `Este mes van <b>${m.gastados} créditos</b> en ${m.consultas} ${m.consultas === 1 ? 'consulta' : 'consultas'}.` : 'Este mes aún no se ha gastado ninguno.'} Así van sus apuestas frente a las de las 9:00:</p>
    <table class="tabla desglose"><tr><th></th><th class="n">Apuestas</th><th class="n">Ganancia</th><th class="n">Rendim.${A('rendimiento')}</th></tr>${fila('Por noticias', n.noticias)}${fila('De las 9:00', n.manana)}</table></div>`;
}
function tarjetaPretemporada(p) {
  const fila = (n, r) => `<tr><td>${n}</td><td class="n">${r.apuestas}</td><td class="n">${r.apuestas ? pct(r.aciertos, false, 0) : '–'}</td><td class="n ${clase(r.yield)}">${r.apuestas ? pct(r.yield, true) : '–'}</td><td class="n">${pct(r.pct_cierre, false, 0)}</td></tr>`;
  return `<div class="tarjeta desplaza" style="margin-bottom:10px"><h3>🏋️ Pretemporada simulada</h3>
    <p style="margin:0 0 6px;font-size:13.5px">Antes de empezar repasaron ${p.dias} días ya jugados (del ${esc(p.desde)} al ${esc(p.hasta)}), con cuotas reales del ganador y sin noticias. De ahí vienen sus primeras reglas y lecciones. Así les fue:</p>
    <table class="tabla desglose"><tr><th></th><th class="n">Apuestas</th><th class="n">Aciertos</th><th class="n">Rendim.${A('rendimiento')}</th><th class="n">Bate cierre${A('cierre')}</th></tr>${Object.values(p.agentes || {}).map(r => fila(esc(r.nombre), r)).join('')}${p.tonta ? fila('🤖 La estrategia tonta', p.tonta) : ''}</table></div>`;
}

    <div class="tarjeta" style="margin-bottom:10px"><h3>📚 La biblioteca de la oficina</h3>${D.biblioteca?.length ? `<ul class="reglas">${D.biblioteca.map(e => `<li>${esc(e.texto)} <small>${esc(e.autor)}, ${esc(e.fecha)}</small></li>`).join('')}</ul><small style="color:var(--suave)">Lo mejor que ha aprendido la oficina. Inés la ordena cada domingo y todos la leen antes de apostar.</small>` : '<p class="vacio">Inés la empezará a ordenar el domingo con lo mejor de cada uno.</p>'}</div>
    <div class="rejilla dos">${activos().map(a => {
      const ult = (a.reflexiones || []).slice(-1)[0];
      return `<div class="tarjeta desplaza"><button class="analista" data-ficha="${a.id}" style="margin-bottom:6px">${pix(a)}<div class="info"><b>${esc(a.nombre)}</b><small>${esc(a.titulo)}</small></div></button>
        <h4 style="margin:8px 0 2px">Sus reglas</h4>${a.reglas?.length ? `<ol class="reglas">${a.reglas.map(r => `<li>${esc(r.texto)} <small>desde el ${esc(r.desde)}</small></li>`).join('')}</ol>` : '<p class="vacio">Se las pondrá en su primera reflexión del domingo.</p>'}
        ${a.reglas_retiradas?.length ? `<p class="retiradas" style="font-size:12.5px">Retiradas: ${a.reglas_retiradas.slice(-3).map(r => `<s>${esc(r.texto)}</s>`).join(' · ')}</p>` : ''}
        ${ult ? `<details class="plegable"><summary>Su última reflexión (${esc(ult.fecha)})</summary>${esc(ult.texto)}</details>` : ''}
        <h4 style="margin:10px 0 2px">Sus lecciones de cada noche</h4>${a.lecciones?.length ? `<ul class="reglas">${a.lecciones.slice(-3).reverse().map(l => `<li>${esc(l.texto)} <small>${esc(l.fecha)}</small></li>`).join('')}</ul>` : '<p class="vacio">La escribe por la noche cuando se resuelven sus apuestas.</p>'}
        <h4 style="margin:10px 0 2px">Lo que dejó pasar</h4>${(() => { const d = a.descartes || {}, n = (d.ganadas || 0) + (d.perdidas || 0);
          return n ? `<p style="margin:0">Su mejor descarte de cada día habría ganado <b>${d.ganadas} de ${n}</b> (<span class="${clase(d.unidades)}">${d.unidades > 0 ? '+' : ''}${d.unidades.toFixed(2)} unidades</span>). ${d.unidades > 0 ? 'Quizá es demasiado prudente.' : 'Hace bien en descartarlos.'}</p>` : '<p class="vacio">Aún no se ha jugado ninguno de sus descartes.</p>'; })()}
        <h4 style="margin:10px 0 2px">Dónde gana y dónde pierde</h4>${tablaDesglose(a.desglose)}

/* ---------- Ánimo de los analistas ---------- */
const EMOCIONES = { euforia: ['😄', 'Euforia'], confianza: ['😊', 'Confianza'], calma: ['😌', 'Calma'], alivio: ['😮‍💨', 'Alivio'],
  orgullo: ['😎', 'Orgullo'], tension: ['😬', 'Tensión'], frustracion: ['😤', 'Frustración'], miedo: ['😨', 'Miedo'],
  envidia: ['😒', 'Envidia'], aburrimiento: ['🥱', 'Aburrimiento'], arrepentimiento: ['😣', 'Arrepentimiento'],
  impaciencia: ['😑', 'Impaciencia'], codicia: ['🤑', 'Codicia'], sorpresa: ['😲', 'Sorpresa'], revancha: ['😠', 'Revancha'] };
const emo = e => EMOCIONES[e] ? `<span title="${EMOCIONES[e][1]}">${EMOCIONES[e][0]}</span>` : '';
function tablaEmociones(pe) {
  const filas = Object.entries(pe || {}).sort((x, y) => y[1].apuestas - x[1].apuestas).map(([e, r]) =>
    `<tr><td>${emo(e)} ${esc(EMOCIONES[e]?.[1] || e)}</td><td class="n">${r.ganadas} de ${r.apuestas}</td><td class="n ${clase(r.ganancia)}">${(r.ganancia > 0 ? '+' : '') + Math.round(r.ganancia)} €</td><td class="n ${clase(r.yield)}">${pct(r.yield, true)}</td></tr>`);
  return filas.length ? `<table class="tabla desglose"><tr><th>Ánimo al apostar</th><th class="n">Ganadas</th><th class="n">Ganancia</th><th class="n">Rendim.${A('rendimiento')}</th></tr>${filas.join('')}</table>`
    : '<p class="vacio">Aún no hay apuestas liquidadas con su ánimo apuntado.</p>';
}
function tarjetaAnimo(a) {
  const temp = Object.entries(a.temperamento || {}).map(([e, v]) => `<span class="chip ${v > 1 ? 'ojo' : ''}">${emo(e)} ${esc(EMOCIONES[e]?.[1] || e)} ×${String(v).replace('.', ',')}</span>`).join(' ');
  return `<div class="tarjeta"><h3>Su ánimo${A('animo')}</h3>${a.animo.mezcla.filter(f => f.pct >= .05).map(f => `<div class="emocion"><div class="fila"><span>${f.cara} <b>${esc(f.nombre)}</b></span><span class="num">${Math.round(f.pct * 100)} %</span></div><div class="barra"><i style="width:${f.pct * 100}%"></i></div><small>${esc(f.motivo)}</small></div>`).join('')}
    ${temp ? `<p style="margin:10px 0 0;font-size:12.5px"><span style="color:var(--suave)">Su temperamento:</span> ${temp}</p>` : ''}
    <h4 style="margin:12px 0 2px">Con qué ánimo acierta</h4>${tablaEmociones(a.animo.por_emocion)}</div>`;
}

function cerrarFicha() { FICHA_ID = null; $('#ficha').classList.remove('abierta', 'entera'); actualizarEnlace(); }

/* ---------- Navegación ---------- */
let PANEL = null;
const TITULOS = { plantilla: 'La plantilla', cartelera: 'Cartelera', boletos: 'Boletos', clasificacion: 'Clasificación', sala: 'Sala de analistas', aprendizaje: 'Aprendizaje' };
const PINTAR = { plantilla: pintarPlantilla, cartelera: pintarCartelera, boletos: pintarBoletos, clasificacion: pintarClasificacion, sala: pintarSala, aprendizaje: pintarAprendizaje };
const GRANDES = new Set(['cartelera', 'boletos', 'clasificacion', 'sala', 'aprendizaje']);
// Cada panel o ficha que se abre es un paso en el historial: el botón atrás del móvil cierra lo último abierto
let APLICANDO = false;
let PASOS = [];   // los pasos abiertos, para saber si la flecha ← tiene adónde volver
function pintarAtras() {
  const previo = PASOS[PASOS.length - 2];
  document.body.classList.toggle('puede-atras', !!previo && previo !== '#/oficina' && previo !== '');
}
function actualizarEnlace() {
  const h = '#/' + (PANEL || 'oficina') + (FICHA_ID ? '/' + FICHA_ID : '');
  if (APLICANDO || location.hash === h) return;
  const abre = (FICHA_ID && !location.hash.includes('/' + FICHA_ID)) || (PANEL && !location.hash.startsWith('#/' + PANEL));
  if (abre) { history.pushState({ web: 1 }, '', h); PASOS.push(h); } else { history.replaceState(history.state, '', h); PASOS[PASOS.length - 1] = h; }
  pintarAtras();
}
function cerrarTodo() { if (FICHA_ID) cerrarFicha(); if (PANEL) cerrarPanel(); PASOS = [location.hash]; pintarAtras(); }
function cerrarConAtras(cerrar) { if (history.state?.web) history.back(); else cerrar(); }
function aplicarEnlace() {
  APLICANDO = true;
  const [, tab, ficha] = location.hash.split('/');
  if (PINTAR[tab]) { if (PANEL !== tab) abrirPanel(tab); } else if (PANEL) cerrarPanel();
  if (ficha) { if (FICHA_ID !== ficha) abrirFicha(ficha); } else if (FICHA_ID) cerrarFicha();
  APLICANDO = false;
}
addEventListener('popstate', () => {
  cerrarGlobo(); aplicarEnlace();
  const i = PASOS.lastIndexOf(location.hash); if (i >= 0) PASOS.length = i + 1; else PASOS = [location.hash];
  pintarAtras();
});
function abrirPanel(tab) {
  if (!PINTAR[tab]) return cerrarPanel();
  PANEL = tab;
  document.querySelectorAll('.dock [data-tab]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === tab));
  document.querySelectorAll('#panel > section').forEach(s => s.hidden = s.id !== tab);
  $('#titulo-panel').textContent = TITULOS[tab];
  const panel = $('#panel'); panel.classList.add('abierto'); panel.classList.toggle('grande', GRANDES.has(tab)); panel.scrollTop = 0;
  document.body.classList.add('con-panel'); document.body.classList.toggle('panel-grande', GRANDES.has(tab));
  PINTAR[tab]();
  actualizarEnlace();
}
function cerrarPanel() {
  PANEL = null; $('#panel').classList.remove('abierto', 'entera');
  document.body.classList.remove('con-panel', 'panel-grande');
  document.querySelectorAll('.dock [data-tab]').forEach(b => b.setAttribute('aria-pressed', 'false'));
  actualizarEnlace();
}
$('#plegar').onclick = cerrarTodo;
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { PANEL === t.dataset.tab && t.closest('.dock') ? cerrarPanel() : abrirPanel(t.dataset.tab); return; }
  const ay = e.target.closest('[data-ayuda]'); if (ay) { e.stopPropagation(); ay.getAttribute('aria-expanded') === 'true' ? cerrarGlobo() : abrirGlobo(ay); return; }
  cerrarGlobo();
  const es = e.target.closest('[data-estirar]'); if (es) { (es.dataset.estirar === 'panel' ? $('#panel') : $('#ficha')).classList.toggle('entera'); return; }
  if (e.target.closest('#ficha .cerrar')) { cerrarTodo(); return; }
  if (e.target.closest('.atras')) { history.back(); return; }
  const f = e.target.closest('[data-ficha]'); if (f) { abrirFicha(f.dataset.ficha); return; }
  const pp = e.target.closest('[data-partido]'); if (pp) { abrirPartido(pp.dataset.partido); return; }
  const b = e.target.closest('[data-filtro]'); if (b) { FILTRO[b.dataset.filtro] = b.dataset.valor; pintarBoletos(); }
});
addEventListener('keydown', e => { if (e.key !== 'Escape') return; if ($('#globo')) cerrarGlobo(); else if (FICHA_ID) cerrarConAtras(cerrarFicha); else if (PANEL) cerrarConAtras(cerrarPanel); });

async function cargar() {
  try {
    const r = await fetch('datos.json?' + Date.now(), { cache: 'no-store' });
    D = await r.json();
  } catch (e) {
    D = D || { agentes: [], apuestas: [], sala: [], bitacora: [], cartelera: { partidos: [] }, nombres_casa: {}, reglas: { revision: 100, real: 500, despido: .1 }, botes: {} };
  }
}
(async function () {
  await cargar();await ARTE_LISTO;
  try { await document.fonts.load('700 11px "Pixelify Sans"'); } catch (e) { /* sin la letra pixelada se usa otra */ }

  pintarFondo();montarVista();poblar();pintarCabecera();

  aplicarEnlace(); PASOS = [location.hash]; pintarAtras();
  // Se recargan los datos cada 5 minutos por si ha habido novedades
  setInterval(async () => {
    const antes = D.actualizado; await cargar(); if (D.actualizado === antes) return;
    pintarCabecera(); poblar(); if (PANEL) PINTAR[PANEL](); if (FICHA_ID) abrirFicha(FICHA_ID);
  }, 300000);
})();
</script>
</body>
</html>
