<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#120b08">
<meta name="color-scheme" content="dark">
<title>La oficina del tenis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Madera oscura, ladrillo y verde de pista: los colores de la oficina */
:root {
  color-scheme: dark;
  --fondo: #120b08; --texto: #f4e7d3; --suave: #c2a88a; --borde: rgba(255, 214, 170, .14);
  --tarjeta: rgba(255, 236, 210, .05); --tarjeta2: rgba(255, 236, 210, .08);
  --madera: #6b4226; --madera-clara: #8a5a36; --madera-oscura: #2a170d;
  --acento: #a6d65a; --acento-suave: rgba(166, 214, 90, .16); --ambar: #e9b44c;
  --sube: #8fe07a; --baja: #ff8a75; --aviso: #f2c25a;
  --sube-fondo: rgba(143, 224, 122, .14); --baja-fondo: rgba(255, 138, 117, .15); --neutro-fondo: rgba(255, 236, 210, .08); --aviso-fondo: rgba(242, 194, 90, .14);
  --papel: #f3e6cc; --tinta: #2a1d12;
  --pixel: "Pixelify Sans", "Courier New", monospace;
  --vidrio: linear-gradient(165deg, rgba(58, 34, 20, .93), rgba(30, 18, 11, .93));
  --sombra: 0 14px 40px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 220, 180, .1);
}
* { box-sizing: border-box; font-feature-settings: "calt" 0, "liga" 0, "clig" 0; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; overflow: hidden; color: var(--texto);
  background: radial-gradient(900px 600px at 50% 40%, #2a1710, transparent 70%), var(--fondo);
  font: 14.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--acento); }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.sube { color: var(--sube) !important; } .baja { color: var(--baja) !important; }
.vacio { color: var(--suave); font-style: italic; margin: 0; }

/* Marcos de madera: cabecera, menú, paneles y ficha */
.madera { background: var(--vidrio); border: 2px solid var(--madera); box-shadow: var(--sombra), inset 0 0 0 1px rgba(0, 0, 0, .35);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

/* --- La oficina a pantalla completa --- */
.escena { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.caja-lienzo { position: absolute; transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
@media (min-width: 1000px) { body.con-panel .caja-lienzo { transform: translateX(200px); } body.con-panel.panel-grande .caja-lienzo { transform: none; } }
.caja-lienzo canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
body.ampliada .escena { cursor: grab; } .escena.moviendo, .escena.moviendo canvas { cursor: grabbing; }
.capa { position: absolute; inset: 0; pointer-events: none; container-type: inline-size; }
.etiqueta { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; border: 0; cursor: pointer; white-space: nowrap;
  font: 700 11.5px/1 var(--pixel); color: #fff; background: rgba(26, 14, 8, .78); padding: 3px 6px 3px 4px; border-radius: 5px;
  box-shadow: 0 0 0 1px rgba(255, 220, 180, .25); display: inline-flex; gap: 4px; align-items: center; }
.etiqueta .emo { font-size: 11px; }
.etiqueta[aria-pressed="true"] { background: var(--acento); color: #17240b; }
.etiqueta.sala { background: rgba(32, 48, 82, .9); box-shadow: 0 0 0 1px rgba(150, 190, 255, .45); padding: 4px 8px 4px 5px; }
.bocadillo { position: absolute; transform: translate(-50%, calc(-100% - 20px)); width: max-content; max-width: min(250px, 42%);
  background: #fffaf0; color: #1d140c; border: 2px solid #1d140c; border-radius: 6px; padding: 4px 8px;
  font: 600 12px/1.3 var(--pixel); opacity: 0; transition: opacity .25s; pointer-events: none; box-shadow: 3px 3px 0 rgba(0, 0, 0, .35); }
.bocadillo::after { content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #1d140c; border-bottom: 0; }
.bocadillo.visible { opacity: 1; }
.bocadillo small { color: #6b4a2c; font-weight: 700; }
.cartel { position: absolute; transform: translate(-50%, -100%); background: #ffd55a; color: #3d2c00; font: 700 11px var(--pixel); padding: 2px 7px; border: 2px solid #3d2c00; border-radius: 3px; }
/* Letrero de luces en la pared del fondo (va inclinado como la pared) */
.letrero { position: absolute; transform: translate(-50%, -50%) skewY(26.565deg); pointer-events: auto; cursor: pointer; border: 0; background: none; padding: 0;
  font: 700 1.25cqw/1.15 var(--pixel); color: #b8ff6a; text-shadow: 0 0 .5cqw rgba(160, 255, 90, .8); letter-spacing: .06em; white-space: nowrap; text-align: center; }
.letrero small { display: block; font-size: .78cqw; color: #ffd36b; text-shadow: 0 0 .4cqw rgba(255, 200, 90, .7); }
.zoom { position: fixed; z-index: 21; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 4px; padding: 5px; border-radius: 12px; }
.zoom button { width: 36px; height: 36px; border: 0; border-radius: 8px; background: rgba(255, 236, 210, .08); font-size: 20px; line-height: 1; cursor: pointer; }
.zoom button:hover { background: rgba(255, 236, 210, .16); }

/* --- Cabecera, menú y pie --- */
.cab { position: fixed; z-index: 22; top: 14px; right: 14px; display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 12px; }
.logo { width: 34px; height: 34px; border-radius: 8px; background: #2f6b34; display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 2px #a6d65a; }
.cab h1 { font: 700 16px/1.1 var(--pixel); margin: 0; }
.cab .sub { color: var(--suave); font-size: 11.5px; }
.dock { position: fixed; z-index: 26; top: 14px; left: 14px; display: flex; gap: 3px; padding: 5px; border-radius: 12px; }
.dock button { display: flex; align-items: center; gap: 7px; border: 0; background: none; color: var(--suave); font: 600 14px var(--pixel); padding: 7px 11px; border-radius: 8px; cursor: pointer; }
.dock button .ico { font-size: 16px; line-height: 1; }
.dock button:hover { color: var(--texto); background: rgba(255, 236, 210, .07); }
.dock button[aria-pressed="true"] { color: #17240b; background: var(--acento); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .25); }
.pie-escena { position: fixed; z-index: 20; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 14px; white-space: nowrap;
  padding: 6px 14px; border-radius: 999px; font-size: 12.5px; color: var(--suave); }
.pie-escena #que-hacen { color: var(--texto); font-weight: 600; }
body.con-panel .pie-escena { left: calc(50% + 200px); }
body.panel-grande .pie-escena { opacity: 0; }
@media (max-width: 1150px) { .pie-escena .pista { display: none; } }
@media (min-width: 700px) and (max-width: 1250px) { .cab .tit { display: none; } .cab { padding-right: 6px; } }

/* --- Paneles --- */
.panel { position: fixed; z-index: 24; top: 72px; left: 14px; bottom: 14px; width: 390px; border-radius: 14px; overflow-y: auto; overscroll-behavior: contain; padding: 0 14px 18px;
  transform: translateX(calc(-100% - 30px)); visibility: hidden; transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility .3s, width .3s; }
.panel.abierto { transform: none; visibility: visible; }
.panel.grande { width: min(900px, calc(100vw - 28px)); }
.cab-panel { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 12px 0 10px; margin: 0 -2px;
  background: linear-gradient(#3a2214 70%, rgba(58, 34, 20, 0)); }
.cab-panel b { font: 700 19px var(--pixel); }
.plegar { border: 0; width: 32px; height: 32px; border-radius: 8px; background: rgba(255, 236, 210, .1); font-size: 18px; line-height: 1; cursor: pointer; }
section[hidden] { display: none; }
h3 { font: 700 15px var(--pixel); margin: 0 0 6px; letter-spacing: .01em; }
h4 { font: 700 15px var(--pixel); margin: 18px 2px 8px; color: var(--ambar); }
.tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 12px 14px; }
.tarjeta + .tarjeta { margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; padding: 1px 9px; border-radius: 999px; background: var(--neutro-fondo); color: var(--suave); white-space: nowrap; }
.chip.bien { background: var(--sube-fondo); color: var(--sube); } .chip.mal { background: var(--baja-fondo); color: var(--baja); } .chip.ojo { background: var(--aviso-fondo); color: var(--aviso); }
.rejilla { display: grid; gap: 10px; }
.rejilla > .tarjeta + .tarjeta { margin-top: 0; }
@media (min-width: 760px) { .panel.grande .rejilla.dos { grid-template-columns: 1fr 1fr; } }
.hoy ul { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 5px; }
.bitacora { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.bitacora li { padding: 5px 0; border-top: 1px dashed var(--borde); } .bitacora li:first-child { border-top: 0; }
.bitacora time { color: var(--suave); font-size: 11.5px; margin-right: 6px; }
.pix { width: 46px; height: 46px; image-rendering: pixelated; background: rgba(255, 236, 210, .07); border-radius: 8px; flex: none; border: 2px solid var(--madera); }
.pix.grande { width: 84px; height: 84px; }
.pix.mini { width: 26px; height: 26px; border-width: 1px; border-radius: 5px; }
.analista { display: flex; gap: 12px; align-items: center; cursor: pointer; text-align: left; width: 100%; border: 0; background: none; padding: 0; }
.analista .info { flex: 1; min-width: 0; }
.analista .info b { font: 700 16px var(--pixel); display: block; }
.analista .info small { color: var(--suave); font-size: 12.5px; }
.cifras { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--suave); }
.cifras b { display: block; font-size: 14.5px; color: var(--texto); }
.barra { height: 8px; background: rgba(0, 0, 0, .35); border-radius: 2px; overflow: hidden; margin-top: 8px; box-shadow: inset 0 0 0 1px rgba(255, 220, 180, .12); }
.barra i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--acento) 0 8px, #7fae3e 8px 10px); }

/* Cartelera */
.torneo { margin-top: 14px; }
.torneo > h3 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.partido { margin-top: 8px; }
.partido .cabecera { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.partido .jugadores { font-weight: 700; }
.partido .hora { color: var(--suave); font-size: 12.5px; }
.mercados { display: grid; gap: 8px; margin-top: 10px; }
@media (min-width: 760px) { .panel.grande .mercados { grid-template-columns: repeat(3, 1fr); } }
.mercado { background: rgba(0, 0, 0, .22); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.mercado b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--suave); margin-bottom: 3px; }
.opcion { display: flex; justify-content: space-between; gap: 6px; padding: 2px 0; }
.opcion .q { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ambar); }
.opcion .p { color: var(--suave); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.apostado { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.superficie { font-size: 11.5px; padding: 1px 8px; border-radius: 3px; font-weight: 700; color: #fff; }
.superficie.hard { background: #3466b0; } .superficie.clay { background: #c0602e; } .superficie.grass { background: #3d8a3a; }

/* Boletos: papel claro con bordes troquelados */
.filtros { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 10px; }
.filtros button { border: 1px solid var(--borde); background: var(--tarjeta); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.filtros button[aria-pressed="true"] { background: var(--acento); color: #17240b; border-color: var(--acento); font-weight: 700; }
.boletos { display: grid; gap: 14px; }
@media (min-width: 760px) { .panel.grande .boletos { grid-template-columns: repeat(2, 1fr); } }
.boleto { position: relative; background: var(--papel); color: var(--tinta); border-radius: 3px; padding: 14px 16px 12px; font-size: 13.5px; box-shadow: 0 4px 0 rgba(0, 0, 0, .3); }
.boleto::before, .boleto::after { content: ""; position: absolute; left: 0; right: 0; height: 6px; background: radial-gradient(circle at 5px 0, #2a1810 4px, transparent 4.5px) repeat-x; background-size: 10px 6px; }
.boleto::before { top: 0; } .boleto::after { bottom: 0; transform: scaleY(-1); }
.boleto .quien { display: flex; align-items: center; gap: 8px; font: 700 14px var(--pixel); }
.boleto .quien small { font: 12px system-ui, sans-serif; color: #7a6650; }
.boleto .sel { font-weight: 750; font-size: 15px; margin: 8px 0 2px; padding-right: 70px; }
.boleto .det { color: #6d5a45; font-size: 12.5px; }
.boleto .linea { display: flex; justify-content: space-between; gap: 6px; border-top: 1px dashed #c9b48f; padding-top: 6px; margin-top: 6px; flex-wrap: wrap; }
.boleto .chip { background: rgba(0, 0, 0, .07); color: #6d5a45; } .boleto .chip.bien { color: #2d7a2a; background: rgba(45, 122, 42, .12); } .boleto .chip.mal { color: #b03a26; background: rgba(176, 58, 38, .12); }
.boleto .sube { color: #2d7a2a !important; } .boleto .baja { color: #b03a26 !important; }
.boleto details { margin-top: 6px; color: #6d5a45; font-size: 12.5px; }
.sello { position: absolute; top: 12px; right: 12px; font: 700 13px var(--pixel); padding: 1px 8px; border: 2px solid currentColor; border-radius: 3px; transform: rotate(5deg); }
.sello.ganada { color: #2d7a2a; } .sello.perdida { color: #b03a26; } .sello.pendiente { color: #a26a00; } .sello.nula { color: #7a6650; }

/* Clasificación */
table.tabla { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tabla th { text-align: left; font-size: 11.5px; color: var(--suave); font-weight: 600; padding: 6px; border-bottom: 1px solid var(--borde); }
.tabla td { padding: 7px 6px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
.tabla td.n, .tabla th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tabla tr:last-child td { border-bottom: 0; }
.tabla .nom { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-weight: 650; }
.desplaza { overflow-x: auto; }
.medalla { font-size: 16px; }

/* Sala e informes */
.informe p { margin: 6px 0; }
details.plegable > summary { cursor: pointer; font-weight: 650; list-style: none; }
details.plegable > summary::-webkit-details-marker { display: none; }
details.plegable > summary::before { content: "▸ "; color: var(--suave); }
details.plegable[open] > summary::before { content: "▾ "; }

/* --- Ficha de un analista --- */
.ficha { position: fixed; z-index: 30; top: 14px; right: 14px; bottom: 14px; width: min(470px, calc(100vw - 28px)); border-radius: 14px; overflow-y: auto; overscroll-behavior: contain;
  padding: 16px 16px 30px; transform: translateX(calc(100% + 30px)); visibility: hidden; transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility .3s; }
.ficha.abierta { transform: none; visibility: visible; }
.ficha .cabecera { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.ficha .cabecera h2 { font: 700 22px var(--pixel); margin: 0; }
.ficha .cerrar { margin-left: auto; align-self: flex-start; border: 0; background: rgba(255, 236, 210, .1); border-radius: 8px; width: 36px; height: 36px; cursor: pointer; font-size: 17px; }
.grafica svg { width: 100%; height: 150px; display: block; }
.carta { font-family: Georgia, "Times New Roman", serif; font-style: italic; background: var(--papel); color: var(--tinta); border-radius: 3px; padding: 10px 12px; margin: 6px 0 0; }

@media (max-width: 699px) {
  .cab { top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px; } .cab .sub { display: none; }
  .dock { top: auto; bottom: calc(8px + env(safe-area-inset-bottom)); left: 8px; right: 8px; justify-content: space-around; }
  .dock button { flex: 1 1 0; min-width: 0; flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 2px; }
  .zoom { right: 10px; top: calc(66px + env(safe-area-inset-top)); bottom: auto; }
  .zoom button { width: 38px; height: 38px; }
  .pie-escena { bottom: calc(76px + env(safe-area-inset-bottom)); font-size: 11.5px; } .pie-escena .pista, .pie-escena .aviso-legal { display: none; }
  .panel, .panel.grande, .ficha { top: 0; left: 0; right: 0; bottom: 0; width: auto; border-radius: 0; border: 0; transform: translateY(105%); padding-top: env(safe-area-inset-top); }
  .panel { bottom: calc(68px + env(safe-area-inset-bottom)); }
  .panel.abierto, .ficha.abierta { transform: none; }
  body.con-panel .pie-escena { display: none; }
  .bocadillo { font-size: 10.5px; max-width: 60%; }
  .etiqueta { font-size: 10.5px; }
}
@media (prefers-reduced-motion: reduce) { .panel, .ficha, .bocadillo, .caja-lienzo { transition: none; } }
</style>
</head>
<body>
<div class="escena" id="escena"><div class="caja-lienzo" id="caja-lienzo"><canvas id="lienzo" aria-label="La oficina de los analistas de tenis"></canvas><div class="capa" id="capa"></div></div></div>
<nav class="dock madera" aria-label="Paneles">
  <button data-tab="plantilla" aria-pressed="false"><span class="ico">👥</span><span>Plantilla</span></button>
  <button data-tab="cartelera" aria-pressed="false"><span class="ico">🎾</span><span>Cartelera</span></button>
  <button data-tab="boletos" aria-pressed="false"><span class="ico">🧾</span><span>Boletos</span></button>
  <button data-tab="clasificacion" aria-pressed="false"><span class="ico">🏆</span><span>Clasificación</span></button>
  <button data-tab="sala" aria-pressed="false"><span class="ico">📋</span><span>Sala</span></button>
</nav>
<header class="cab madera">
  <div class="logo" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 26 26" shape-rendering="crispEdges"><rect x="5" y="5" width="16" height="16" fill="#d7e64a"/><rect x="3" y="7" width="2" height="12" fill="#d7e64a"/><rect x="21" y="7" width="2" height="12" fill="#d7e64a"/><rect x="7" y="3" width="12" height="2" fill="#d7e64a"/><rect x="7" y="21" width="12" height="2" fill="#d7e64a"/><rect x="6" y="7" width="2" height="12" fill="#fff"/><rect x="18" y="7" width="2" height="12" fill="#fff"/></svg></div>
  <div class="tit"><h1>La oficina del tenis</h1><div class="sub" id="subtitulo"></div></div>
</header>
<aside class="panel madera" id="panel" aria-label="Panel">
  <div class="cab-panel"><b id="titulo-panel"></b><button class="plegar" id="plegar" aria-label="Cerrar el panel">✕</button></div>
  <section id="plantilla" hidden></section>
  <section id="cartelera" hidden></section>
  <section id="boletos" hidden></section>
  <section id="clasificacion" hidden></section>
  <section id="sala" hidden></section>
</aside>
<aside class="ficha madera" id="ficha" aria-label="Ficha del analista"></aside>
<div class="pie-escena madera"><span id="que-hacen"></span><span class="pista">Pulsa en un analista para ver su ficha</span><span class="aviso-legal">Dinero ficticio · cuotas reales</span></div>
<script>
'use strict';
let D = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = (x, signo = false) => (signo && x > 0 ? '+' : '') + Number(x || 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const pct = (x, signo = false, dec = 1) => x == null ? '–' : (signo && x > 0 ? '+' : '') + (x * 100).toLocaleString('es-ES', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + ' %';
const clase = x => x > 0 ? 'sube' : x < 0 ? 'baja' : '';
const MADRID = new Intl.DateTimeFormat('es-ES', { timeZone: 'Europe/Madrid', weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const HORA = new Intl.DateTimeFormat('es-ES', { timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit' });
const cuando = iso => iso ? MADRID.format(new Date(iso)) : '';
const NOM_MERCADO = { h2h: 'Ganador', spreads: 'Hándicap de juegos', totals: 'Total de juegos', set1: 'Primer set', sets_exactos: 'Sets exactos' };
const SUPERFICIE = { hard: 'Pista dura', clay: 'Tierra batida', grass: 'Hierba' };
const ESTADOS = { ganada: 'Ganada', perdida: 'Perdida', nula: 'Anulada', pendiente: 'Pendiente', 'media ganada': 'Media ganada', 'media perdida': 'Media perdida' };

      ${!D.botes['2']?.activo ? '<p style="margin:6px 0 0;font-size:12.5px;color:var(--suave)">El bote 2 (primer set y resultado exacto en sets) arrancará cuando haya una fuente gratis y fiable de esas cuotas.</p>' : ''}
      <div class="grafica" style="margin-top:10px">${grafica(a)}</div></div>
    ${real ? `<div class="tarjeta"><h3>Camino al dinero real</h3><p style="margin:0">${real.apuestas} de ${real.objetivo} apuestas · ${real.ganancia > 0 ? '✓ gana dinero' : '✗ aún no gana dinero'} · ${real.pct_cierre > .5 ? '✓' : '✗'} bate el cierre en la mayoría (${pct(real.pct_cierre, false, 0)})</p><div class="barra"><i style="width:${Math.min(100, real.apuestas / real.objetivo * 100)}%"></i></div></div>` : ''}
    ${a.carta_recibida ? `<div class="tarjeta"><h3>La carta que le dejó su predecesor</h3><p class="carta">${esc(a.carta_recibida)}</p></div>` : ''}
    ${a.carta ? `<div class="tarjeta"><h3>Su carta de despedida</h3><p class="carta">${esc(a.carta)}</p></div>` : ''}
    <div class="tarjeta"><h3>Sus decisiones</h3>${informes.map((d, i) => `<details class="plegable informe" ${i === 0 ? 'open' : ''} style="margin-top:8px"><summary>${cuando(d.hora)} · ${esc(d.resumen)}</summary>
      ${d.informe ? Object.entries({ jornada: 'La jornada', a_favor: 'A favor', en_contra: 'En contra', riesgos: 'Riesgos', situacion: 'Su puesto' }).filter(([k]) => d.informe[k]).map(([k, n]) => `<p><b>${n}:</b> ${esc(d.informe[k])}</p>`).join('') : ''}
      ${d.descarte ? `<p><b>Lo que dejó pasar:</b> ${esc(d.descarte)}</p>` : ''}${d.rechazos?.length ? `<p style="color:var(--suave);font-size:12.5px">Rechazadas por el control de riesgo: ${esc(d.rechazos.join('; '))}</p>` : ''}</details>`).join('') || '<p class="vacio">Aún no ha decidido nada.</p>'}</div>
    <div class="tarjeta"><h3>Sus reflexiones de los domingos</h3>${(a.reflexiones || []).slice().reverse().map(r => `<p><b>${esc(r.fecha)}:</b> ${esc(r.texto)}${r.regla ? `<br><i>Regla para la semana: ${esc(r.regla)}</i>` : ''}</p>`).join('') || '<p class="vacio">La primera llegará el domingo.</p>'}</div>
    <div class="tarjeta"><h3>Sus boletos</h3><div class="boletos">${D.apuestas.filter(b => b.agente === a.id).slice(0, 20).map(boleto).join('') || '<p class="vacio">Sin boletos todavía.</p>'}</div></div>`;
  $('#ficha').classList.add('abierta'); $('#ficha').scrollTop = 0;
  actualizarEnlace();
}
function cerrarFicha() { FICHA_ID = null; $('#ficha').classList.remove('abierta'); actualizarEnlace(); }

/* ---------- Navegación ---------- */
let PANEL = null;
const TITULOS = { plantilla: 'La plantilla', cartelera: 'Cartelera', boletos: 'Boletos', clasificacion: 'Clasificación', sala: 'Sala de analistas' };
const PINTAR = { plantilla: pintarPlantilla, cartelera: pintarCartelera, boletos: pintarBoletos, clasificacion: pintarClasificacion, sala: pintarSala };
const GRANDES = new Set(['cartelera', 'boletos', 'clasificacion']);
function actualizarEnlace() { history.replaceState(null, '', '#/' + (PANEL || 'oficina') + (FICHA_ID ? '/' + FICHA_ID : '')); }
function abrirPanel(tab) {
  if (!PINTAR[tab]) return cerrarPanel();
  PANEL = tab;
  document.querySelectorAll('.dock [data-tab]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === tab));
  document.querySelectorAll('#panel > section').forEach(s => s.hidden = s.id !== tab);
  $('#titulo-panel').textContent = TITULOS[tab];
  const panel = $('#panel'); panel.classList.add('abierto'); panel.classList.toggle('grande', GRANDES.has(tab)); panel.scrollTop = 0;
  document.body.classList.add('con-panel'); document.body.classList.toggle('panel-grande', GRANDES.has(tab));
  PINTAR[tab]();
  actualizarEnlace();
}
function cerrarPanel() {
  PANEL = null; $('#panel').classList.remove('abierto');
  document.body.classList.remove('con-panel', 'panel-grande');
  document.querySelectorAll('.dock [data-tab]').forEach(b => b.setAttribute('aria-pressed', 'false'));
  actualizarEnlace();
}
$('#plegar').onclick = cerrarPanel;
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { PANEL === t.dataset.tab && t.closest('.dock') ? cerrarPanel() : abrirPanel(t.dataset.tab); return; }
  if (e.target.closest('#ficha .cerrar')) { cerrarFicha(); return; }
  const f = e.target.closest('[data-ficha]'); if (f) { abrirFicha(f.dataset.ficha); return; }
  const b = e.target.closest('[data-filtro]'); if (b) { FILTRO[b.dataset.filtro] = b.dataset.valor; pintarBoletos(); }
});
addEventListener('keydown', e => { if (e.key === 'Escape') { if (FICHA_ID) cerrarFicha(); else if (PANEL) cerrarPanel(); } });

async function cargar() {
  try {
    const r = await fetch('datos.json?' + Date.now(), { cache: 'no-store' });
    D = await r.json();
  } catch (e) {
    D = D || { agentes: [], apuestas: [], sala: [], bitacora: [], cartelera: { partidos: [] }, nombres_casa: {}, reglas: { revision: 100, real: 500, despido: .1 }, botes: {} };
  }
}
(async function () {
  await cargar();
  try { await document.fonts.load('700 11px "Pixelify Sans"'); } catch (e) { /* sin la letra pixelada se usa otra */ }
  pintarFondo(); montarVista(); poblar(); pintarCabecera();
  const [, tab, ficha] = location.hash.split('/');
  if (PINTAR[tab]) abrirPanel(tab);
  if (ficha) abrirFicha(ficha);
  // Se recargan los datos cada 5 minutos por si ha habido novedades
  setInterval(async () => {
    const antes = D.actualizado; await cargar(); if (D.actualizado === antes) return;
    pintarCabecera(); poblar(); if (PANEL) PINTAR[PANEL](); if (FICHA_ID) abrirFicha(FICHA_ID);
  }, 300000);
})();
</script>
