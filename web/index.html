<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c2a1e">
<title>La oficina del tenis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --fondo: #f4ead9; --tarjeta: #fffaf1; --tarjeta2: #f8efe0; --texto: #2a2119; --suave: #76685a; --borde: #e3d3bb;
  --acento: #3a9b4a; --acento-suave: #e2f2df; --madera: #c98a4b; --sube: #2f8a3c; --baja: #c4422f; --aviso: #b06a00;
  --sube-fondo: #e3f3df; --baja-fondo: #fbe6e1; --neutro-fondo: #efe4d3; --aviso-fondo: #fdf0d6; --marco: #1d241e;
  --pixel: "Pixelify Sans", "Courier New", monospace; --radio: 14px;
  --sombra: 0 1px 2px rgba(60, 40, 20, .06), 0 6px 18px rgba(60, 40, 20, .07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #15130f; --tarjeta: #1f1b16; --tarjeta2: #26211b; --texto: #f1e8da; --suave: #b0a291; --borde: #3a3128;
    --acento: #6fd17f; --acento-suave: #1f3322; --sube: #6fd17f; --baja: #ff8a75; --aviso: #f5b84b;
    --sube-fondo: #1b2e1e; --baja-fondo: #3a201b; --neutro-fondo: #2c261f; --aviso-fondo: #33270f; --sombra: none;
  }
}
:root[data-theme="dark"] {
  --fondo: #15130f; --tarjeta: #1f1b16; --tarjeta2: #26211b; --texto: #f1e8da; --suave: #b0a291; --borde: #3a3128;
  --acento: #6fd17f; --acento-suave: #1f3322; --sube: #6fd17f; --baja: #ff8a75; --aviso: #f5b84b;
  --sube-fondo: #1b2e1e; --baja-fondo: #3a201b; --neutro-fondo: #2c261f; --aviso-fondo: #33270f; --sombra: none;
}
* { box-sizing: border-box; font-feature-settings: "calt" 0, "liga" 0, "clig" 0; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fondo); color: var(--texto);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
a { color: var(--acento); }
button { font: inherit; color: inherit; }
.cab { max-width: 1120px; margin: 0 auto; padding: 16px 16px 4px; display: flex; align-items: center; gap: 12px; }
.logo { width: 40px; height: 40px; border-radius: 10px; background: var(--marco); display: grid; place-items: center; flex: none;
  box-shadow: inset 0 0 0 2px #3a9b4a; }
.cab h1 { font: 700 22px/1.1 var(--pixel); margin: 0; letter-spacing: .01em; }
.cab .sub { color: var(--suave); font-size: 12.5px; }
.cab .estado { margin-left: auto; text-align: right; font-size: 12px; color: var(--suave); }
@media (max-width: 640px) { .cab { flex-wrap: wrap; } .cab .estado { margin-left: 52px; text-align: left; width: 100%; } .cab .sub { display: none; } }
nav.pestanas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--tarjeta);
  border-top: 1px solid var(--borde); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: flex; justify-content: center; }
nav.pestanas .dentro { display: flex; gap: 4px; width: 100%; max-width: 620px; }
nav.pestanas button { flex: 1; border: 0; background: none; padding: 6px 2px; border-radius: 10px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font: 600 11.5px var(--pixel); color: var(--suave); }
nav.pestanas button span.ico { font-size: 18px; line-height: 1; }
nav.pestanas button[aria-selected="true"] { color: var(--acento); background: var(--acento-suave); }
@media (min-width: 900px) {
  body { padding-bottom: 0; }
  nav.pestanas { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--borde); background: var(--fondo); }
  nav.pestanas button { flex-direction: row; justify-content: center; gap: 8px; font-size: 15px; padding: 9px; }
}
main { max-width: 1120px; margin: 0 auto; padding: 8px 16px 28px; }
section[hidden] { display: none; }
h2 { font: 700 20px var(--pixel); margin: 22px 2px 10px; }
h3 { font-size: 15px; margin: 0 0 6px; }
.tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: var(--radio); padding: 14px 16px; box-shadow: var(--sombra); }
.vacio { color: var(--suave); font-style: italic; margin: 0; }
.sube { color: var(--sube) !important; } .baja { color: var(--baja) !important; }
.num { font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; padding: 1px 9px; border-radius: 999px;
  background: var(--neutro-fondo); color: var(--suave); white-space: nowrap; }
.chip.bien { background: var(--sube-fondo); color: var(--sube); } .chip.mal { background: var(--baja-fondo); color: var(--baja); }
.chip.ojo { background: var(--aviso-fondo); color: var(--aviso); }
.rejilla { display: grid; gap: 12px; }
@media (min-width: 700px) { .rejilla.dos { grid-template-columns: 1fr 1fr; } .rejilla.cuatro { grid-template-columns: repeat(4, 1fr); } }

/* --- La oficina --- */
.escenario { display: grid; gap: 14px; align-items: start; }
@media (min-width: 980px) { .escenario { grid-template-columns: minmax(0, 1fr) 330px; } }
.marco { background: var(--marco); padding: 10px; border-radius: 12px; box-shadow: 0 0 0 3px #2c3a2e, 0 10px 30px rgba(0,0,0,.25); position: relative; }
.marco::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 4px; height: 3px; background: #3a9b4a; border-radius: 2px; opacity: .8; }
.caja-lienzo { position: relative; width: 100%; aspect-ratio: 1 / 1; max-width: 760px; margin: 0 auto; }
.caja-lienzo canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; touch-action: manipulation; }
.capa { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.burbuja { position: absolute; transform: translate(-50%, -100%); background: #fff; color: #1a1a1a; border: 3px solid #111;
  padding: 5px 9px; font: 600 clamp(9.5px, 1.55vw, 15px)/1.25 var(--pixel); max-width: min(60%, 340px); width: max-content; box-shadow: 3px 3px 0 rgba(0,0,0,.25); }
.burbuja::after { content: ""; position: absolute; left: 50%; bottom: -10px; width: 10px; height: 10px; background: #fff;
  border-right: 3px solid #111; border-bottom: 3px solid #111; transform: translateX(-50%) skewX(-20deg); clip-path: polygon(0 0, 100% 0, 100% 100%); }
.etiqueta { position: absolute; transform: translate(-50%, -100%); font: 700 clamp(8px, 1.15vw, 12px) var(--pixel); color: #fff;
  background: rgba(20, 24, 20, .72); padding: 0 5px; border-radius: 3px; white-space: nowrap; }
.etiqueta.tu { background: #3fbf4f; color: #0b250f; }
.leyenda-oficina { color: var(--suave); font-size: 12.5px; text-align: center; margin: 8px 0 0; }
.lado .tarjeta + .tarjeta { margin-top: 12px; }
.hoy li { margin: 4px 0; } .hoy ul { padding-left: 18px; margin: 6px 0 0; }
.bitacora { list-style: none; padding: 0; margin: 0; font-size: 13px; max-height: 260px; overflow: auto; }
.bitacora li { padding: 5px 0; border-top: 1px dashed var(--borde); } .bitacora li:first-child { border-top: 0; }
.bitacora time { color: var(--suave); font-size: 11.5px; margin-right: 6px; }

/* --- Analistas --- */
.analista { display: flex; gap: 12px; align-items: center; cursor: pointer; text-align: left; width: 100%; }
.pix { width: 46px; height: 46px; image-rendering: pixelated; background: var(--tarjeta2); border-radius: 10px; flex: none; border: 2px solid var(--borde); }
.pix.grande { width: 84px; height: 84px; }
.analista .info { flex: 1; min-width: 0; }
.analista .info b { font: 700 16px var(--pixel); display: block; }
.analista .info small { color: var(--suave); font-size: 12.5px; }
.cifras { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 12.5px; color: var(--suave); }
.cifras b { display: block; font-size: 15px; color: var(--texto); }
.barra { height: 7px; background: var(--neutro-fondo); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.barra i { display: block; height: 100%; background: var(--acento); border-radius: 99px; }

/* --- Cartelera --- */
.torneo { margin-top: 16px; }
.torneo > h3 { font: 700 16px var(--pixel); display: flex; gap: 8px; align-items: center; }
.partido { padding: 12px 14px; margin-top: 8px; }
.partido .cabecera { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.partido .jugadores { font-weight: 700; }
.partido .hora { color: var(--suave); font-size: 12.5px; }
.mercados { display: grid; gap: 8px; margin-top: 10px; }
@media (min-width: 700px) { .mercados { grid-template-columns: repeat(3, 1fr); } }
.mercado { background: var(--tarjeta2); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
.mercado b { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); margin-bottom: 3px; }
.opcion { display: flex; justify-content: space-between; gap: 6px; padding: 2px 0; }
.opcion .q { font-variant-numeric: tabular-nums; font-weight: 700; }
.opcion .p { color: var(--suave); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.apostado { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }

/* --- Boletos --- */
.filtros { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; }
.filtros button { border: 1px solid var(--borde); background: var(--tarjeta); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.filtros button[aria-pressed="true"] { background: var(--acento); color: #fff; border-color: var(--acento); }
.boletos { display: grid; gap: 12px; }
@media (min-width: 700px) { .boletos { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1040px) { .boletos { grid-template-columns: repeat(3, 1fr); } }
.boleto { position: relative; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 6px; padding: 14px 16px 12px;
  box-shadow: var(--sombra); font-size: 13.5px; }
.boleto::before, .boleto::after { content: ""; position: absolute; left: 10px; right: 10px; height: 6px;
  background: radial-gradient(circle at 4px 0, var(--fondo) 3px, transparent 3.5px) repeat-x; background-size: 10px 6px; }
.boleto::before { top: -1px; } .boleto::after { bottom: -1px; transform: scaleY(-1); }
.boleto .quien { display: flex; align-items: center; gap: 8px; font: 700 14px var(--pixel); }
.boleto .quien img { width: 26px; height: 26px; image-rendering: pixelated; }
.boleto .sel { font-weight: 750; font-size: 15px; margin: 8px 0 2px; }
.boleto .linea { display: flex; justify-content: space-between; gap: 6px; border-top: 1px dashed var(--borde); padding-top: 6px; margin-top: 6px; }
.boleto .motivo { color: var(--suave); font-size: 12.5px; margin: 6px 0 0; }
.sello { position: absolute; top: 10px; right: 12px; font: 700 13px var(--pixel); padding: 1px 8px; border: 2px solid currentColor; border-radius: 4px; transform: rotate(4deg); }
.sello.ganada { color: var(--sube); } .sello.perdida { color: var(--baja); } .sello.pendiente { color: var(--aviso); } .sello.nula { color: var(--suave); }

/* --- Clasificación --- */
table.tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabla th { text-align: left; font-size: 12px; color: var(--suave); font-weight: 600; padding: 6px 6px; border-bottom: 1px solid var(--borde); }
.tabla td { padding: 8px 6px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
.tabla td.n, .tabla th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tabla tr:last-child td { border-bottom: 0; }
.tabla .nom { display: flex; gap: 8px; align-items: center; cursor: pointer; font-weight: 650; }
.tabla .nom img { width: 26px; height: 26px; image-rendering: pixelated; }
.desplaza { overflow-x: auto; }

/* --- Sala e informes --- */
.informe p { margin: 6px 0; } .informe b { font-weight: 700; }
.informe .hora { color: var(--suave); font-size: 12.5px; }
details.plegable > summary { cursor: pointer; font-weight: 650; list-style: none; }
details.plegable > summary::-webkit-details-marker { display: none; }
details.plegable > summary::before { content: "▸ "; color: var(--suave); }
details.plegable[open] > summary::before { content: "▾ "; }

/* --- Ficha --- */
.velo { position: fixed; inset: 0; background: rgba(10, 8, 5, .45); z-index: 20; display: flex; justify-content: flex-end; }
.velo[hidden] { display: none; }
.ficha { width: min(560px, 100%); height: 100%; overflow: auto; background: var(--fondo); padding: 18px 16px 40px; box-shadow: -10px 0 30px rgba(0,0,0,.2); }
.ficha .cabecera { display: flex; gap: 14px; align-items: center; }
.ficha .cabecera h2 { margin: 0; }
.ficha .cerrar { margin-left: auto; border: 1px solid var(--borde); background: var(--tarjeta); border-radius: 10px; width: 38px; height: 38px; cursor: pointer; font-size: 18px; }
.ficha .tarjeta { margin-top: 12px; }
.grafica svg { width: 100%; height: 150px; display: block; }
.carta { font-family: Georgia, "Times New Roman", serif; font-style: italic; background: var(--tarjeta2); border-left: 3px solid var(--madera); padding: 10px 12px; margin: 6px 0 0; }
.pie { color: var(--suave); font-size: 12px; text-align: center; margin: 30px 0 0; }
</style>
</head>
<body>
<header class="cab">
  <div class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 26 26" shape-rendering="crispEdges"><rect x="5" y="5" width="16" height="16" fill="#d7e64a"/><rect x="3" y="7" width="2" height="12" fill="#d7e64a"/><rect x="21" y="7" width="2" height="12" fill="#d7e64a"/><rect x="7" y="3" width="12" height="2" fill="#d7e64a"/><rect x="7" y="21" width="12" height="2" fill="#d7e64a"/><rect x="6" y="7" width="2" height="12" fill="#fff"/><rect x="18" y="7" width="2" height="12" fill="#fff"/></svg></div>
  <div><h1>La oficina del tenis</h1><div class="sub" id="subtitulo">Cuatro analistas de IA apuestan al tenis con cuotas reales y dinero ficticio</div></div>
  <div class="estado" id="estado-cab"></div>
</header>
<nav class="pestanas"><div class="dentro" role="tablist">
  <button role="tab" data-tab="oficina" aria-selected="true"><span class="ico">🏢</span>Oficina</button>
  <button role="tab" data-tab="cartelera"><span class="ico">🎾</span>Cartelera</button>
  <button role="tab" data-tab="boletos"><span class="ico">🧾</span>Boletos</button>
  <button role="tab" data-tab="clasificacion"><span class="ico">🏆</span>Clasificación</button>
  <button role="tab" data-tab="sala"><span class="ico">📋</span>Sala</button>
</div></nav>
<main>
  <section id="oficina">
    <div class="escenario">
      <div>
        <div class="marco"><div class="caja-lienzo" id="caja-lienzo"><canvas id="lienzo" width="416" height="416" aria-label="La oficina de los analistas"></canvas><div class="capa" id="capa"></div></div></div>
        <p class="leyenda-oficina">Pulsa en un analista para ver su ficha. Pulsa en el suelo (o usa las flechas) para pasear.</p>
      </div>
      <div class="lado">
        <div class="tarjeta hoy" id="hoy"></div>
        <div class="tarjeta"><h3>Lo último</h3><ul class="bitacora" id="bitacora"></ul></div>
      </div>
    </div>
    <h2>La plantilla</h2>
    <div class="rejilla dos" id="plantilla"></div>
  </section>
  <section id="cartelera" hidden></section>
  <section id="boletos" hidden></section>
  <section id="clasificacion" hidden></section>
  <section id="sala" hidden></section>
  <p class="pie" id="pie"></p>
</main>
<div class="velo" id="velo" hidden><aside class="ficha" id="ficha" role="dialog" aria-modal="true"></aside></div>
<script>
'use strict';
let D = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = (x, signo = false) => (signo && x > 0 ? '+' : '') + Number(x || 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const pct = (x, signo = false, dec = 1) => x == null ? '–' : (signo && x > 0 ? '+' : '') + (x * 100).toLocaleString('es-ES', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + ' %';
const clase = x => x > 0 ? 'sube' : x < 0 ? 'baja' : '';
const MADRID = new Intl.DateTimeFormat('es-ES', { timeZone: 'Europe/Madrid', weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const HORA = new Intl.DateTimeFormat('es-ES', { timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit' });
const DIA = new Intl.DateTimeFormat('es-ES', { timeZone: 'Europe/Madrid', weekday: 'long', day: 'numeric', month: 'long' });
const cuando = iso => iso ? MADRID.format(new Date(iso)) : '';
const NOM_MERCADO = { h2h: 'Ganador', spreads: 'Hándicap de juegos', totals: 'Total de juegos', set1: 'Primer set', sets_exactos: 'Sets exactos' };
const SUPERFICIE = { hard: 'pista dura', clay: 'tierra batida', grass: 'hierba' };
const ESTADOS = { ganada: 'Ganada', perdida: 'Perdida', nula: 'Anulada', pendiente: 'Pendiente', 'media ganada': 'Media ganada', 'media perdida': 'Media perdida' };
const activos = () => D.agentes.filter(a => a.estado === 'activo');
const agentePor = id => D.agentes.find(a => a.id === id);

/* ---------- Personajes pixelados ---------- */
const PIELES = ['#f6d3b3', '#eebd94', '#d9a377', '#b97d55', '#8a5a3c', '#ffe0c4'];
const PELOS = ['#2b1b10', '#5a3418', '#a4652b', '#16161a', '#b5461f', '#e6c76a', '#6e6e78', '#3b2a5a'];
const PANTALONES = ['#2d3142', '#3c4258', '#23324d', '#4b3b2e', '#33363d'];
const PEINADOS = ['corto', 'largo', 'moño', 'pinchos', 'flequillo'];
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
function aspecto(semilla, camisa) {
  const h = hash(semilla);
  return { piel: PIELES[h % PIELES.length], pelo: PELOS[(h >>> 3) % PELOS.length], camisa, pantalon: PANTALONES[(h >>> 6) % PANTALONES.length],
    peinado: PEINADOS[(h >>> 9) % PEINADOS.length], gafas: (h >>> 12) % 4 === 0 };
}
function mezclar(c, d, f) { const a = parseInt(c.slice(1), 16), b = parseInt(d.slice(1), 16), m = k => Math.round((a >> k & 255) * (1 - f) + (b >> k & 255) * f); return '#' + [16, 8, 0].map(k => m(k).toString(16).padStart(2, '0')).join(''); }
const oscuro = (c, f = .25) => mezclar(c, '#000000', f), claro = (c, f = .25) => mezclar(c, '#ffffff', f);
// Contorno oscuro de 1 px, como en los juegos de píxeles
function contornear(c) {
  const ctx = c.getContext('2d'), { width: w, height: h } = c, img = ctx.getImageData(0, 0, w, h), d = img.data, lleno = k => d[k * 4 + 3] > 100, borde = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const k = y * w + x; if (lleno(k)) continue;
    if ((x > 0 && lleno(k - 1)) || (x < w - 1 && lleno(k + 1)) || (y > 0 && lleno(k - w)) || (y < h - 1 && lleno(k + w))) borde.push(k);
  }
  for (const k of borde) { d[k * 4] = 34; d[k * 4 + 1] = 26; d[k * 4 + 2] = 22; d[k * 4 + 3] = 255; }
  ctx.putImageData(img, 0, 0); return c;
}
const SP = { W: 20, H: 30, X: 10, Y: 28 };  // tamaño del sprite y sus pies
// dir: 'abajo' (de frente), 'arriba' (de espaldas), 'izq', 'der'
function pintarPersonaje(ctx, ap, dir, f, pose) {
  const r = (c, x, y, w, h) => { ctx.fillStyle = c; ctx.fillRect(SP.X + x, SP.Y + y, w, h); };
  const lado = dir === 'izq' || dir === 'der', esp = dir === 'arriba', anda = pose === 'andar', sent = pose === 'sentado';
  const piel = ap.piel, pielS = oscuro(piel, .14), cam = ap.camisa, camS = oscuro(cam, .25), camL = claro(cam, .2), pelo = ap.pelo, peloL = claro(pelo, .2);
  const pan = ap.pantalon, zap = '#2a2622';
  const p = anda ? [1, 0, -1, 0][f % 4] : 0;
  // Piernas

      <div class="barra"><i style="width:${Math.min(100, s.liquidadas / D.reglas.revision * 100)}%"></i></div></div>` : ''}
    <div class="tarjeta"><h3>Resultados</h3><div class="cifras" style="margin-top:0"><div>Ganancia<b class="${clase(t.ganancia)}">${eur(t.ganancia, true)}</b></div><div title="Lo que gana o pierde por cada euro apostado">Rendimiento<b class="${clase(t.yield)}">${pct(t.yield, true)}</b></div><div>Aciertos<b>${pct(t.aciertos, false, 0)}</b></div><div>Bate el cierre<b>${pct(t.pct_cierre, false, 0)}</b></div></div>
      ${Object.entries(a.botes).map(([k, b]) => `<p style="margin:10px 0 0;font-size:13.5px"><b>${esc(D.botes[k]?.nombre || 'Bote ' + k)}</b> (${esc((D.botes[k]?.mercados || []).join(', '))}): vale ${eur(b.valor)}, ${b.apuestas} apuestas, ${eur(b.ganancia, true)}.</p>`).join('')}
      ${!D.botes['2']?.activo ? '<p style="margin:6px 0 0;font-size:12.5px;color:var(--suave)">El bote 2 (primer set y resultado exacto en sets) arrancará cuando haya una fuente gratis y fiable de esas cuotas.</p>' : ''}
      <div class="grafica" style="margin-top:10px">${grafica(a)}</div></div>
    ${real ? `<div class="tarjeta"><h3>Camino al dinero real</h3><p style="margin:0">${real.apuestas} de ${real.objetivo} apuestas · ${real.ganancia > 0 ? '✓ gana dinero' : '✗ aún no gana dinero'} · ${real.pct_cierre > .5 ? '✓' : '✗'} bate el cierre en la mayoría (${pct(real.pct_cierre, false, 0)})</p><div class="barra"><i style="width:${Math.min(100, real.apuestas / real.objetivo * 100)}%"></i></div></div>` : ''}
    ${a.carta_recibida ? `<div class="tarjeta"><h3>La carta que le dejó su predecesor</h3><p class="carta">${esc(a.carta_recibida)}</p></div>` : ''}
    ${a.carta ? `<div class="tarjeta"><h3>Su carta de despedida</h3><p class="carta">${esc(a.carta)}</p></div>` : ''}
    <div class="tarjeta"><h3>Sus decisiones</h3>${informes.map((d, i) => `<details class="plegable informe" ${i === 0 ? 'open' : ''} style="margin-top:8px"><summary>${cuando(d.hora)} · ${esc(d.resumen)}</summary>
      ${d.informe ? Object.entries({ jornada: 'La jornada', a_favor: 'A favor', en_contra: 'En contra', riesgos: 'Riesgos', situacion: 'Su puesto' }).filter(([k]) => d.informe[k]).map(([k, n]) => `<p><b>${n}:</b> ${esc(d.informe[k])}</p>`).join('') : ''}
      ${d.descarte ? `<p><b>Lo que dejó pasar:</b> ${esc(d.descarte)}</p>` : ''}${d.rechazos?.length ? `<p style="color:var(--suave);font-size:12.5px">Rechazadas por el control de riesgo: ${esc(d.rechazos.join('; '))}</p>` : ''}</details>`).join('') || '<p class="vacio">Aún no ha decidido nada.</p>'}</div>
    <div class="tarjeta"><h3>Sus reflexiones de los domingos</h3>${(a.reflexiones || []).slice().reverse().map(r => `<p><b>${esc(r.fecha)}:</b> ${esc(r.texto)}${r.regla ? `<br><i>Regla para la semana: ${esc(r.regla)}</i>` : ''}</p>`).join('') || '<p class="vacio">La primera llegará el domingo.</p>'}</div>
    <div class="tarjeta"><h3>Sus boletos</h3><div class="boletos" style="grid-template-columns:1fr">${D.apuestas.filter(b => b.agente === a.id).slice(0, 20).map(boleto).join('') || '<p class="vacio">Sin boletos todavía.</p>'}</div></div>`;
  $('#velo').hidden = false;
  history.replaceState(null, '', '#/' + PANEL + '/' + id);
}
function cerrarFicha() { $('#velo').hidden = true; history.replaceState(null, '', '#/' + PANEL); }
$('#velo').addEventListener('click', e => { if (e.target.id === 'velo' || e.target.closest('.cerrar')) cerrarFicha(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#velo').hidden) cerrarFicha(); });
document.addEventListener('click', e => {
  const f = e.target.closest('[data-ficha]'); if (f) { abrirFicha(f.dataset.ficha); return; }
  const b = e.target.closest('[data-filtro]'); if (b) { FILTRO[b.dataset.filtro] = b.dataset.valor; pintarBoletos(); }
});

/* ---------- Navegación ---------- */
let PANEL = 'oficina';
const PINTAR = { oficina: () => { pintarHoy(); pintarPlantilla(); }, cartelera, boletos: pintarBoletos, clasificacion: pintarClasificacion, sala: pintarSala };
function ir(tab) {
  if (!PINTAR[tab]) tab = 'oficina';
  PANEL = tab;
  document.querySelectorAll('nav [data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== tab);
  PINTAR[tab]();
  history.replaceState(null, '', '#/' + tab);
}
document.querySelectorAll('nav [data-tab]').forEach(b => b.addEventListener('click', () => { ir(b.dataset.tab); scrollTo(0, 0); }));

async function cargar() {
  try {
    const r = await fetch('datos.json?' + Date.now(), { cache: 'no-store' });
    D = await r.json();
  } catch (e) {
    D = { agentes: [], apuestas: [], sala: [], bitacora: [], cartelera: { partidos: [] }, nombres_casa: {}, reglas: { revision: 100, real: 500, despido: .1 }, botes: {} };
  }
}
(async function () {
  await cargar();
  try { await document.fonts.load('700 11px "Pixelify Sans"'); } catch (e) { /* sin la letra pixelada se usa otra */ }
  pintarFondo(); prepararRejilla(); crearEscena(); pintarCabecera();
  const [, tab, ficha] = location.hash.split('/');
  ir(tab || 'oficina');
  if (ficha) abrirFicha(ficha);
  requestAnimationFrame(bucle);
  // Se recargan los datos cada 5 minutos por si ha habido novedades
  setInterval(async () => { await cargar(); pintarCabecera(); const viejas = ESC; crearEscena(); ESC.tu = viejas.tu; PINTAR[PANEL](); }, 300000);
})();
</script>
</body>
