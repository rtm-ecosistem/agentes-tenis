name: Sala de analistas

on:
  # El despertador la lanza a las 14:00 y a las 20:00 de España (la de las 9:00 va dentro de la decisión).
  # Los domingos a las 20:00, además, cada analista escribe su reflexión de la semana. Reservas de GitHub:
  schedule:
    - cron: "40 12,13,18,19 * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Ejecutar aunque no sea la hora (solo para pruebas)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  # Todas las tareas escriben en datos/: nunca a la vez.
  group: datos-tenis
  cancel-in-progress: false

jobs:
  tarea:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      # Siempre lo último de main: si esperó a otra ejecución, sus datos ya están dentro
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Noticias e informe de la sala
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROVEEDOR_IA: ${{ vars.PROVEEDOR_IA }}
          MODELO_GEMINI: ${{ vars.MODELO_GEMINI }}
          MODELO_GEMINI_LIGERO: ${{ vars.MODELO_GEMINI_LIGERO }}
          MODELO_CLAUDE: ${{ vars.MODELO_CLAUDE }}
          CASA: ${{ vars.CASA }}
          BOTE2_ACTIVO: ${{ vars.BOTE2_ACTIVO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agentes.ciclo sala ${{ inputs.forzar && '--forzar' || '' }}
      # Se firma con la cuenta del dueño (email privado de GitHub): el plan gratis de Vercel solo publica sus cambios.
      - name: Guardar resultados
        run: |
          git config user.name "rtm-ecosistem"
          git config user.email "340233035+rtm-ecosistem@users.noreply.github.com"
          git add datos web
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Sala $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push
